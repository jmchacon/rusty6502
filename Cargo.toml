[workspace]
members = [
    "./assemble",
    "./assembler",
    "./c64basic",
    "./chip",
    "./convertprg",
    "./cpu",
    "./cpu_proc_macros",
    "./disassembler",
    "./handasm",
    "./io",
    "./irq",
    "./memory",
    "./monitor",
    "./monitor_gui",
    "./monitor_tui",
    "./nes/apu",
    "./nes/cart_renderer",
    "./nes/ines",
    "./nes/ines_debug",
    "./nes/nes_chr",
    "./nes/nes_memory",
    "./nes/nes_pal",
    "./nes/nes_pal_gui",
    "./nes/nes_pal_render",
    "./nes/ppu",
]
default-members = [
    "./assemble",
    "./assembler",
    "./c64basic",
    "./chip",
    "./convertprg",
    "./cpu",
    "./cpu_proc_macros",
    "./disassembler",
    "./handasm",
    "./io",
    "./irq",
    "./memory",
    "./monitor",
    "./monitor_gui",
    "./monitor_tui",
    "./nes/apu",
    "./nes/cart_renderer",
    "./nes/ines",
    "./nes/ines_debug",
    "./nes/nes_chr",
    "./nes/nes_memory",
    "./nes/nes_pal",
    "./nes/nes_pal_gui",
    "./nes/nes_pal_render",
    "./nes/ppu",
]
resolver = "2"

[profile.test]
opt-level = 3

[profile.bench]
debug = true

[profile.release]
debug = true

[workspace.dependencies]
ahash = "0.8.12"
apu = { path = "./nes/apu", version = "~0.1" }
assemble = { path = "./assemble", version = "~0.1" }
c64basic = { path = "./c64basic", version = "~0.1" }
chip = { path = "./chip", version = "~0.1" }
clap = { version = "~4.6.6", features = ["derive", "wrap_help"] }
clap-num = "~1.2"
color-eyre = { version = "0.6.5", default-features = false }
cpu_proc_macros = { path = "./cpu_proc_macros", version = "~0.1" }
eframe = "0.36.1"
egui = "0.36.1"
ines = { path = "./nes/ines", version = "~0.1" }
io = { path = "./io", version = "~0.1" }
irq = { path = "./irq", version = "~0.1" }
memory = { path = "./memory", version = "~0.1" }
monitor = { path="./monitor", version = "~0.1" }
nes_chr = { path="./nes/nes_chr", version = "~0.1" }
nes_pal = { path="./nes/nes_pal", version = "~0.1" }
nes_pal_gui = { path="./nes/nes_pal_gui", version = "~0.1" }
ntest = "0.9.5"
ppu = { path = "./nes/ppu", version = "~0.1" }
rand = "0.10.2"
regex = "1.13.1"
rusty6502 = { path = "./", version = "~0.1" }
serde = "1.0.229"
serde_json = "1.0.151"
strum_macros = "0.28.0"
strum = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.20"

proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["extra-traits", "full"] }

[workspace.package]
edition = "2021"
rust-version = "1.92"
authors = ["James Chacon <chacon.james@gmail.com>"]

[package]
name = "rusty6502"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
memory = { path = "./memory", version = "~0.1" }
cpu = { path = "./cpu", version = "~0.1" }
chip = { path = "./chip", version = "~0.1" }

