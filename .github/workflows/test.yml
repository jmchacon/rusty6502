permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
# Spend CI time only on latest ref: https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
jobs:
  required:
    runs-on: ubuntu-latest
    name: ubuntu / ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain: [stable, beta]
    # cart_renderer's egui_kittest snapshot tests render headlessly via wgpu,
    # which needs a GPU adapter -- ubuntu-latest has none. Point it at Mesa's
    # software Vulkan driver (installed below) instead of letting it probe
    # every backend (which includes a Vulkan loader crash on driverless
    # Windows runners; here it just fails cleanly, but pinning it is also
    # faster and avoids the GL/DX12 probes).
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Mesa lavapipe (software Vulkan) for headless wgpu tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri mesa-vulkan-drivers
      - name: Cache git folder
        id: cache-git
        uses: actions/cache@v6
        with:
          enableCrossOsArchive: true
          path: SingleStepTests
          key: git-folder2
      - if: steps.cache-git.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: 'SingleStepTests/65x02'
          path: 'SingleStepTests'
      - name: cache-update
        if: steps.cache-git.outputs.cache-hit == 'true'
        run: cd SingleStepTests && git pull
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      # https://twitter.com/jonhoo/status/1571290371124260865
      - name: cargo test --locked
        run:  cargo test -r --locked --all-features --all-targets
        env:
          # The package is checked out at the same level as the cpu package
          # so this ref is one level back.
          SINGLE_STEP_6502_PROCESSOR_TESTS: "../SingleStepTests"
      # https://github.com/rust-lang/cargo/issues/6669
      - name: cargo test --doc
        run: cargo test -r --locked --all-features --doc
        env:
          # The package is checked out at the same level as the cpu package
          # so this ref is one level back.
          SINGLE_STEP_6502_PROCESSOR_TESTS: "../SingleStepTests"
  minimal:
    runs-on: ubuntu-latest
    name: ubuntu / stable / minimal-versions
    # See the `required` job's comment on `WGPU_BACKEND`.
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install Mesa lavapipe (software Vulkan) for headless wgpu tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri mesa-vulkan-drivers
      - name: Cache git folder
        id: cache-git
        uses: actions/cache@v6
        with:
          enableCrossOsArchive: true
          path: SingleStepTests
          key: git-folder2
      - if: steps.cache-git.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: 'SingleStepTests/65x02'
          path: 'SingleStepTests'
      - name: cache-update
        if: steps.cache-git.outputs.cache-hit == 'true'
        run: cd SingleStepTests && git pull
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install nightly for -Zminimal-versions
        uses: dtolnay/rust-toolchain@nightly
      - name: rustup default stable
        run: rustup default stable
      - name: cargo update -Zminimal-versions
        run: cargo +nightly update -Zdirect-minimal-versions
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test -r --locked --all-features --all-targets
        env:
          # The package is checked out at the same level as the cpu package
          # so this ref is one level back.
          SINGLE_STEP_6502_PROCESSOR_TESTS: "../SingleStepTests"
  os-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Cache git folder
        id: cache-git
        uses: actions/cache@v6
        with:
          enableCrossOsArchive: true
          path: SingleStepTests
          key: git-folder2
      - if: steps.cache-git.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: 'SingleStepTests/65x02'
          path: 'SingleStepTests'
      - name: cache-update
        if: steps.cache-git.outputs.cache-hit == 'true'
        run: cd SingleStepTests && git pull
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      # cart_renderer's egui_kittest snapshot tests render headlessly via
      # wgpu. windows-latest has no GPU adapter, and letting wgpu probe every
      # backend crashes outright (Vulkan loader access violation) rather than
      # failing cleanly, so pin it to DX12, which can fall back to the
      # software WARP adapter built into Windows. macOS already passes as-is
      # (its Metal software fallback works headlessly), so leave it alone.
      - name: Set WGPU_BACKEND for headless wgpu tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      - name: cargo test
        if: runner.os != 'Windows'
        run: cargo test -r --locked --all-features --all-targets
        env:
          # The package is checked out at the same level as the cpu package
          # so this ref is one level back.
          SINGLE_STEP_6502_PROCESSOR_TESTS: "../SingleStepTests"
      # Windows only: run everything except cart_renderer normally, then run
      # cart_renderer on its own below with a crash-signature-specific
      # retry, instead of one cargo test invocation covering the workspace.
      - name: cargo test (excluding cart_renderer)
        if: runner.os == 'Windows'
        run: cargo test -r --locked --all-features --all-targets --workspace --exclude cart_renderer
        env:
          # The package is checked out at the same level as the cpu package
          # so this ref is one level back.
          SINGLE_STEP_6502_PROCESSOR_TESTS: "../SingleStepTests"
      # cart_renderer's egui_kittest snapshot tests create a real wgpu GPU
      # device to render headlessly. windows-latest has no GPU, so this runs
      # through the software WARP adapter (see the WGPU_BACKEND note above),
      # which intermittently crashes the *entire test process* with
      # STATUS_ACCESS_VIOLATION (0xc0000005) during device/adapter setup -
      # this is a known class of upstream wgpu/WARP flakiness on Windows
      # (e.g. gfx-rs/wgpu#5879, #6571, #993), not a bug in this repo.
      # Because it's a hard OS-level access violation rather than a Rust
      # panic, it can't be caught or retried from inside the test itself -
      # the process is gone before any in-test retry logic could run - so
      # this retries at the process level instead. Only retries when the
      # failure matches the known crash signature; anything else (a real
      # test regression) fails immediately without burning through retries.
      - name: cargo test cart_renderer (retry on known headless WARP/DX12 crash)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            output=$(cargo test -r --locked --all-features --all-targets -p cart_renderer 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! echo "$output" | grep -q "STATUS_ACCESS_VIOLATION"; then
              echo "cart_renderer tests failed with a non-flaky error - not retrying"
              exit "$status"
            fi
            echo "::warning::cart_renderer tests crashed with the known headless WARP/DX12 STATUS_ACCESS_VIOLATION (attempt $attempt/5), retrying..."
          done
          echo "::error::cart_renderer tests still crashing with STATUS_ACCESS_VIOLATION after 5 attempts"
          exit 1
  coverage:
    runs-on: ubuntu-latest
    name: ubuntu / beta / coverage
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Cache git folder
        id: cache-git
        uses: actions/cache@v6
        with:
          enableCrossOsArchive: true
          path: SingleStepTests
          key: git-folder2
      - if: steps.cache-git.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: 'SingleStepTests/65x02'
          path: 'SingleStepTests'
      - name: cache-update
        if: steps.cache-git.outputs.cache-hit == 'true'
        run: cd SingleStepTests && git pull
      - name: Install beta
        uses: dtolnay/rust-toolchain@beta
        with:
          components: llvm-tools-preview
      - name: cargo install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: "coverage"
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo llvm-cov
        # Exclude nes_pal_gui package as calloop (*nix requirement) can't handle coverage on the version we inherit.
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info --lib --workspace --exclude nes_pal_gui
        env:
          # The package is checked out at the same level as the cpu package
          # so this ref is one level back.
          SINGLE_STEP_6502_PROCESSOR_TESTS: "../SingleStepTests"
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
